name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt --no-cache-dir
      - run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt --no-cache-dir
      - run: mypy orchestrator agent

  test:
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Check lockfiles are up-to-date
        run: |
          pip install pip-tools
          pip-compile --dry-run --output-file=requirements.txt requirements.in
      - name: Install dependencies (pinned)
        run: pip install -r requirements-dev.txt --no-cache-dir
      - name: Run tests with coverage
        run: pytest --cov=orchestrator --cov=agent --cov=simulator --cov-report=term --cov-fail-under=70

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt --no-cache-dir
      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt

  docker-build:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build orchestrator image
        run: docker build -t edgecompute-orchestrator:ci .
